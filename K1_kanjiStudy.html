<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanario KanjiStudy</title>
    <link rel="stylesheet" href="K2_kanjiStudy.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!--========================================================================================-->
<!--=======================================Header===========================================-->
<!--========================================================================================-->
        <header class="header">

    <!-----------------------------------LeftSide-------------------------------------------->

        <a href="index.html" class="menu-btn">
            <img src="src/miku.png" alt="Inicio">
        </a>

    
    <!-----------------------------------HeaderMain--------------------------------------------->

        <h1><span class="title">Kanario.com</span></h1>

            <select id="languageSelect" onchange="setLanguage(this.value)">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="ja">日本語 (Nihongo)</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
            </select>

    <!--------------------------------------SettingsBar----------------------------------------->

        <div class="settings-btn" onclick="toggleSettings()">⚙️</div>
        <div class="settings-panel" id="settingsPanel">
            
        <h3>Themes</h3>

            <button onclick="setTheme('light')">Light</button>
            <button onclick="setTheme('dark')">Dark</button>
            <button onclick="setTheme('thematic')">Thematic</button>


        </div>
    </header>
<!--========================================================================================-->
<!--=======================================MenuDeSeleccion==================================-->
<!--========================================================================================-->

<main>
    <div class="container">
        <div id="setup-screen" class="screen active-screen">   
        
            <div class="nav-container" id="category-tabs">
            </div>
    <!--------------------------------------BotonesAutomaticos----------------------------------------->
            <div class="action-bar">
                <button class="btn-small" onclick="selectAll(true)">Seleccionar Todo</button>
                <a  href="K4_charKANJI.html">
                 <button class="btn-small">ver significados</button>
                 </a>
                <button class="btn-small" onclick="selectAll(false)">Limpiar Todo</button>
            </div>

            <div id="groups-container" class="grid-groups"></div>
    <!--------------------------------------Empezar----------------------------------------->
            <div class="footer-controls">
                <button class="btn-study" onclick="startStudySession()">ESTUDIAR (<span id="count">0</span>)</button>
            </div>
        </div>
    <!--------------------------------------GameScreen----------------------------------------->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <div id="game-progress" style="margin-bottom: 20px; color: var(--text-dim);"></div>
                <div id="game-laps" style="margin-bottom: 20px; color: var(--text-dim);">< </div>
                <div class="kanji-display" id="current-kanji"></div>
                <div class="kana-hint" id="current-kana"></div>
                <div class="kana-hint" id="current-significado"></div>
                <input type="text" id="answer-input" class="answer-input" placeholder="Escribe el romaji..." autocomplete="off">
                <p id="feedback" style="margin-top: 20px; font-weight: bold;"></p>
                <button class="btn-small" style="margin-top: 30px;" onclick="location.reload()">Volver</button>
            </div>
        </div>
    </div>
</main>

<script src="K3_kanjiStudy.js"></script>
</body>
</html>
